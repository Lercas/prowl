id: spotify-client-credentials
info:
  name: Spotify Client Secret Assignment
  author: prowl
  severity: high
  description: Spotify Web API client_secret (32-char base62, [A-Za-z0-9]) assigned in config or environment. Public client IDs are not credentials.
  reference:
    - https://developer.spotify.com/documentation/web-api/concepts/apps
  tags: spotify,saas,oauth,credentials
category: saas
matchers-condition: and
matchers:
  - type: word
    words:
      - spotify
    condition: or
  # The shape is generic, so require a secret assignment rather than the public client ID.
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])spotify(?:[_-]?(?:client[_-]?secret|secret))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.3
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])spotify(?:[_-]?(?:client[_-]?secret|secret))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
    group: 1
