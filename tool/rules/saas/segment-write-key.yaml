id: segment-write-key
info:
  name: Segment Write Key
  author: prowl
  severity: medium
  description: Segment source write key (base62 value in a segment context) used by the Tracking API.
  reference:
    - https://segment.com/docs/connections/find-writekey/
  tags: segment,saas,credentials,token
category: saas
matchers-condition: and
matchers:
  - type: word
    words:
      - segment
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])segment(?:[_-]?(?:write[_-]?key|api[_-]?key|key))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.3
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])segment(?:[_-]?(?:write[_-]?key|api[_-]?key|key))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
    group: 1
