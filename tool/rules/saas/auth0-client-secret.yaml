id: auth0-client-secret
info:
  name: Auth0 Client Secret
  author: prowl
  severity: high
  description: Auth0 application client secret (base64url value in an auth0 context) for the Auth0 APIs.
  reference:
    - https://auth0.com/docs/get-started/applications/application-settings
  tags: auth0,auth,credentials,token
category: auth
matchers-condition: and
matchers:
  - type: word
    words:
      - auth0
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])auth0(?:[_-]?(?:client[_-]?secret|secret))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9_-]{40,128})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.5
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])auth0(?:[_-]?(?:client[_-]?secret|secret))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9_-]{40,128})(?:[^A-Za-z0-9_-]|$)'
    group: 1
