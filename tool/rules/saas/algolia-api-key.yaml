id: algolia-api-key
info:
  name: Algolia API Key
  author: prowl
  severity: high
  description: Algolia admin/API key (32-char hex value in an algolia context) for the Algolia API.
  reference:
    - https://www.algolia.com/doc/guides/security/api-keys/
  tags: algolia,saas,credentials,token
category: saas
matchers-condition: and
matchers:
  - type: word
    words:
      - algolia
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])algolia(?:[_-]?(?:search[_-]?(?:api[_-]?)?key|admin[_-]?(?:api[_-]?)?key|api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([a-f0-9]{32})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.3
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])algolia(?:[_-]?(?:search[_-]?(?:api[_-]?)?key|admin[_-]?(?:api[_-]?)?key|api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([a-f0-9]{32})(?:[^A-Za-z0-9_-]|$)'
    group: 1
