id: vercel-access-token
info:
  name: Vercel Access Token
  author: prowl
  severity: high
  description: Vercel access token (24-char base62 value in a vercel context) for the Vercel API.
  reference:
    - https://vercel.com/docs/rest-api#authentication
  tags: vercel,saas,credentials,token
category: saas
matchers-condition: and
matchers:
  - type: word
    words:
      - vercel
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])vercel(?:[_-]?(?:access[_-]?token|api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{24})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.5
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])vercel(?:[_-]?(?:access[_-]?token|api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{24})(?:[^A-Za-z0-9_-]|$)'
    group: 1
