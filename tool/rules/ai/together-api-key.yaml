id: together-api-key
info:
  name: Together AI API Key
  author: prowl
  severity: high
  description: Together AI API key (64-char hex token) detected next to a together context anchor.
  reference:
    - https://docs.together.ai/docs/quickstart
  tags: together,ai,credentials,token
category: ai
matchers-condition: and
matchers:
  - type: word
    words:
      - together
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])together(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([a-f0-9]{64})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.5
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])together(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([a-f0-9]{64})(?:[^A-Za-z0-9_-]|$)'
    group: 1
