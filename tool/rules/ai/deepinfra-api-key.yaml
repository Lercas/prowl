id: deepinfra-api-key
info:
  name: DeepInfra API Key
  author: prowl
  severity: high
  description: DeepInfra API token (32-char token) detected next to a deepinfra context anchor.
  reference:
    - https://docs.deepinfra.com/account/authentication
  tags: deepinfra,ai,credentials,token
category: ai
matchers-condition: and
matchers:
  - type: word
    words:
      - deepinfra
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])deepinfra(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.5
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])deepinfra(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
    group: 1
