id: assemblyai-api-key
info:
  name: AssemblyAI API Key
  author: prowl
  severity: high
  description: AssemblyAI API key (32 hex chars) detected next to an assemblyai context anchor.
  reference:
    - https://www.assemblyai.com/docs/api-reference/overview
  tags: assemblyai,ai,credentials,token
category: ai
matchers-condition: and
matchers:
  - type: word
    words:
      - assemblyai
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])assemblyai(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([a-f0-9]{32})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.0
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])assemblyai(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([a-f0-9]{32})(?:[^A-Za-z0-9_-]|$)'
    group: 1
