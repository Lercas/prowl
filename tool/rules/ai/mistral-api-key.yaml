id: mistral-api-key
info:
  name: Mistral AI API Key
  author: prowl
  severity: high
  description: Mistral AI API key (32-char token) detected next to a mistral context anchor.
  reference:
    - https://docs.mistral.ai/getting-started/quickstarts/studio/activate-and-generate-api-key/
  tags: mistral,ai,credentials,token
category: ai
matchers-condition: and
matchers:
  - type: word
    words:
      - mistral
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])mistral(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.5
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])mistral(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Za-z0-9]{32})(?:[^A-Za-z0-9_-]|$)'
    group: 1
