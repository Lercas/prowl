id: vultr-api-key
info:
  name: Vultr API Key
  author: prowl
  severity: high
  description: Vultr API key (36-char base32 value in a vultr context).
  reference:
    - https://docs.vultr.com/vultr-api
  tags: vultr,cloud,credentials
category: cloud
matchers-condition: and
matchers:
  - type: word
    words:
      - vultr
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])vultr(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Z2-7]{36})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.5
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])vultr(?:[_-]?(?:api[_-]?key|key|token))?["'']?\s*[:=]\s*["'']?([A-Z2-7]{36})(?:[^A-Za-z0-9_-]|$)'
    group: 1
