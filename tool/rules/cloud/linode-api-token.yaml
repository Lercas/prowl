id: linode-api-token
info:
  name: Linode API Token
  author: prowl
  severity: high
  description: Linode (Akamai) personal access token (64-char hex value in a linode context).
  reference:
    - https://www.linode.com/docs/products/tools/api/guides/manage-api-tokens/
  tags: linode,akamai,cloud,credentials
category: cloud
matchers-condition: and
matchers:
  - type: word
    words:
      - linode
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])linode(?:[_-]?(?:api[_-]?key|access[_-]?token|key|token))?["'']?\s*[:=]\s*["'']?([0-9a-f]{64})(?:[^A-Za-z0-9_-]|$)'
  - type: entropy
    min: 3.0
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])linode(?:[_-]?(?:api[_-]?key|access[_-]?token|key|token))?["'']?\s*[:=]\s*["'']?([0-9a-f]{64})(?:[^A-Za-z0-9_-]|$)'
    group: 1
