id: azure-ad-client-secret
info:
  name: Azure AD / Entra Client Secret
  author: prowl
  severity: high
  description: Azure Active Directory (Entra ID) application client secret value.
  reference:
    - https://learn.microsoft.com/en-us/entra/identity-platform/quickstart-register-app
  tags: azure,microsoft,cloud,credentials,auth
category: cloud
matchers-condition: and
matchers:
  - type: word
    words:
      - azure
      - entra
      - aad
    condition: or
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])(?:azure|entra|aad)[_-]?(?:client[_-]?secret|secret)["'']?\s*[:=]\s*["'']?([A-Za-z0-9\-_~.]{34,40})(?:[^A-Za-z0-9_.~-]|$)'
  - type: entropy
    min: 3.5
extractors:
  - type: regex
    regex:
      - '(?i)(?:^|[^a-z0-9])(?:azure|entra|aad)[_-]?(?:client[_-]?secret|secret)["'']?\s*[:=]\s*["'']?([A-Za-z0-9\-_~.]{34,40})(?:[^A-Za-z0-9_.~-]|$)'
    group: 1
