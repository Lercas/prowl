id: gcp-service-account-private-key-id
info:
  name: GCP Service Account JSON Key
  author: prowl
  severity: critical
  description: Google service-account credentials JSON with actual PEM private-key material. A private_key_id alone is metadata and is not a credential.
  reference:
    - https://cloud.google.com/iam/docs/keys-create-delete
  tags: gcp,google,cloud,credentials,pki
category: cloud
matchers-condition: and
matchers:
  # Require the service-account marker and the actual private key, not a public key ID.
  - type: word
    words:
      - service_account
    condition: and
  - type: regex
    regex:
      - "\"private_key\"\\s*:\\s*\"(\u002d----BEGIN PRIVATE KEY-----[A-Za-z0-9+/=\\\\rn\\s]{64,}?\u002d----END PRIVATE KEY-----)"
  - type: entropy
    min: 3.0
extractors:
  # Extract the private material so verification/identity cannot operate on a public correlator.
  - type: regex
    regex:
      - "\"private_key\"\\s*:\\s*\"(\u002d----BEGIN PRIVATE KEY-----[A-Za-z0-9+/=\\\\rn\\s]{64,}?\u002d----END PRIVATE KEY-----)"
    group: 1
