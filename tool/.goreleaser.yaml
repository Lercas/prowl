# Optional local packaging config. Canonical publishing: ../.github/workflows/release.yml.
# Do not run a second release/publish path for the same version.
version: 2
project_name: prowl

before:
  hooks:
    - go test ./...

builds:
  - id: prowl
    main: ./cmd/prowl
    binary: prowl
    # Static builds carry the validated model and bounded zlib WebAssembly module.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: prowl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishes a Homebrew formula to github.com/Lercas/homebrew-tap so users can `brew install Lercas/tap/prowl`.
# Requires a HOMEBREW_TAP_GITHUB_TOKEN secret with write access to that tap repo.
brews:
  - name: prowl
    repository:
      owner: Lercas
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Lercas/prowl"
    description: "Fast ML-cascade secret scanner (regex + checksum + entropy + ML) with live verification."
    install: |
      bin.install "prowl"
    test: |
      system "#{bin}/prowl", "version"
