# Release and snapshot configuration; see ../wiki/Release-Process.md.
version: 2
project_name: prowl
dist: dist

release:
  draft: true
  prerelease: auto

git:
  ignore_tags: ["tool/*"]

before:
  hooks:
    - go mod verify

builds:
  - id: prowl
    main: ./cmd/prowl
    binary: prowl
    # The canonical Go extractor and portable embedded model support --ml without cgo.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: prowl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: ../README.md
        dst: .
        strip_parent: true
      - src: ../README.ru.md
        dst: .
        strip_parent: true
      - src: ../LICENSE
        dst: .
        strip_parent: true
      - src: README.md
        dst: docs
        strip_parent: true

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    args: ["scan", "$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

snapshot:
  version_template: '{{ if index .Env "PROWL_SNAPSHOT_VERSION" }}{{ .Env.PROWL_SNAPSHOT_VERSION }}{{ else }}{{ incpatch .Version }}-next{{ end }}'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# The release workflow generates the existing macOS/Linux Homebrew formula from
# signed checksums using ../scripts/release/homebrew.py. GoReleaser's brews pipe is deprecated.
