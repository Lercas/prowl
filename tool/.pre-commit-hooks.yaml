# Prowl pre-commit hooks. Add to your .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/Lercas/prowl
#       rev: v1.4.0          # pin the release when published
#       hooks:
#         - id: prowl        # builds from source (needs Go); fast on subsequent runs
#         # - id: prowl-docker # no Go needed; uses the published image
#
# Compatibility definitions for a root repository checkout; both read the actual Git index.
# Use 'prowl scan --fail-on …' args or a .prowl.yaml / .gitleaks.toml in the repo to tune.

- id: prowl
  name: prowl secret scan
  description: Проверяет staged blobs, встроенные правила и полноту скана.
  entry: scripts/precommit-prowl
  language: script
  pass_filenames: false
  always_run: true
  require_serial: true

- id: prowl-docker
  name: prowl secret scan (docker)
  description: Same scan via the published image — no Go toolchain required.
  entry: ghcr.io/lercas/prowl:v1.4.0 scan --staged --strict --bundled --reconstruct --fail-on high
  language: docker_image
  pass_filenames: false
  always_run: true
  require_serial: true
