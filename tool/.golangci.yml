version: "2"

# Security-tool linters: catch bug classes a secret scanner must not ship itself.
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [bodyclose, errcheck, gosec]
      - text: G404
        linters: [gosec] # math/rand is fine where used for non-cryptographic jitter
      - text: QF1001
        linters: [staticcheck] # De Morgan rewrites are less readable in byte-class predicates
