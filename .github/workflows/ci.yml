name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  index-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - name: native private-index and ACL contracts
        working-directory: tool
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: go1.27.4
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: >-
          go test ./internal/secretindex ./internal/scan ./internal/source ./cmd/prowl
          -run 'TestIndex|TestIdentityFiles|TestConcurrentIndex|TestPrivateState|TestIncompleteIndexed|TestAutomaticIndex|TestEmptyCICD'
          -count=1

  native-precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: prepare qualification dependencies
        run: |
          python -m pip install pre-commit==4.7.0
          go -C tool mod download
      - name: validate hook catalog and native consumer contract
        run: |
          pre-commit validate-manifest .pre-commit-hooks.yaml
          python scripts/check_precommit_contract.py --pre-commit "$(command -v pre-commit)"

  native-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: build static qualification binary
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: go1.27.4
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: go -C tool build -o "$RUNNER_TEMP/prowl-acquisition" ./cmd/prowl
      - name: repository snapshots and forge inventory
        run: |
          python3 scripts/check_repository_contract.py "$RUNNER_TEMP/prowl-acquisition"
          python3 scripts/check_forge_inventory.py "$RUNNER_TEMP/prowl-acquisition"
      - name: cloud download boundaries and detector selection
        run: |
          python3 scripts/check_bucket_contract.py "$RUNNER_TEMP/prowl-acquisition"
          python3 scripts/check_config_disable.py "$RUNNER_TEMP/prowl-acquisition"
      - name: Jira and Confluence acquisition reports
        run: python3 scripts/check_atlassian_contract.py "$RUNNER_TEMP/prowl-acquisition"
      - name: fixed candidate comparison and semantic transport
        run: |
          python3 scripts/check_compare_contract.py "$RUNNER_TEMP/prowl-acquisition"
          python3 scripts/check_semantic_contract.py "$RUNNER_TEMP/prowl-acquisition"

  corpus-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: paired corpus performance gate
        run: python3 scripts/perf/compare.py --output-dir "$RUNNER_TEMP/prowl-performance"

  vulnerabilities:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.4']
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        include:
          - go: '1.26.11'
            os: linux
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: tool/go.sum
      - name: install pinned vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: scan release target
        working-directory: tool
        env:
          GOTOOLCHAIN: go${{ matrix.go }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: make vuln

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.57.1
      - name: expose verified Syft executable
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT_CMD" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          install-only: true
      - name: release snapshot and artifact contract
        run: |
          (cd tool && goreleaser check)
          python3 scripts/release/snapshot.py --dist "$RUNNER_TEMP/prowl-snapshot" --version 0.0.0-ci
          python3 scripts/release/verify_artifacts.py "$RUNNER_TEMP/prowl-snapshot"
          python3 scripts/release/homebrew.py --tag v0.0.0-ci --checksums "$RUNNER_TEMP/prowl-snapshot/checksums.txt" --output "$RUNNER_TEMP/prowl.rb"
          ruby -c "$RUNNER_TEMP/prowl.rb"

  static-ml:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.11', '1.27.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: tool/go.sum
      - name: portable feature and model parity
        working-directory: tool
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/mlfeatures ./internal/mlmodel ./internal/mlscore
      - name: release-style ML smoke
        env:
          CGO_ENABLED: '0'
        run: |
          (cd tool && go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/prowl-static" ./cmd/prowl)
          python3 scripts/ml/smoke_static.py --binary "$RUNNER_TEMP/prowl-static" --legacy-model tool/internal/mlmodel/model_binary.json

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l internal cmd)" || { gofmt -l internal cmd; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race + coverage)
        run: go test -race -coverprofile=/tmp/cover.out ./...
      - name: coverage summary
        run: go tool cover -func=/tmp/cover.out | tail -1
      - name: e2e
        run: bash test/e2e.sh
      - name: rules & verifiers valid + manifest fresh
        run: |
          go build -o /tmp/prowl ./cmd/prowl
          /tmp/prowl rules validate rules/
          /tmp/prowl verifiers validate verifiers/
          /tmp/prowl rules manifest rules/
          /tmp/prowl verifiers manifest verifiers/
          git diff --exit-code rules/MANIFEST.sha256 verifiers/MANIFEST.sha256 \
            || { echo "MANIFEST.sha256 stale — run 'prowl rules manifest rules' (and verifiers) and commit"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: tool

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: ruff (real-error classes)
        run: |
          pip install ruff
          ruff check --select E9,F821,F811,F823,F706 .  # respects .gitignore -> only tracked Python
      - name: release contract tests
        run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: performance gate tests
        run: python -m unittest discover -s scripts/perf -p 'test_*.py'
      - name: portable training split tests
        run: |
          pip install -r scripts/ml/requirements.txt
          python -m unittest discover -s scripts/ml -p 'test_*.py'

  fuzz-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - name: fuzz (short)
        run: make fuzz
