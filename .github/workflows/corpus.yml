name: corpus-equivalence

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: tool/go.sum
      - name: select pinned Go source corpus
        working-directory: tool
        env:
          GOTOOLCHAIN: go1.27.4
        run: printf 'PROWL_BENCH_CORPUS=%s/src\n' "$(go env GOROOT)" >> "$GITHUB_ENV"
      - name: compare windowed and whole-text results
        working-directory: tool
        env:
          GOTOOLCHAIN: go1.27.4
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
        run: go test ./internal/detect ./internal/rules -run '^TestWindowedEqualsWholeText$' -count=1 -timeout=15m -v
